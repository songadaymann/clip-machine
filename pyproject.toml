[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-machine"
version = "0.1.0"
description = "A modular, local-first podcast clipping engine"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Jonathan Mann"}]
dependencies = []

[project.scripts]
clip-machine = "clip_machine.cli:main"

[tool.setuptools.package-data]
clip_machine = ["web/*"]

[tool.setuptools.packages.find]
include = ["clip_machine*"]
